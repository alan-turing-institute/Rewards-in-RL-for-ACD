[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewards-in-rl-for-acd"
version = "1.0.0"
description = "Code for 'Beyond Rewards in RL for Cyber Defence' (ICML 2026)"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["yawning_titan_training*", "mini_cage_training*"]
